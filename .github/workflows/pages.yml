# Deploys the static frontend to GitHub Pages (https://arunratanak.github.io/Sokhapheap/).
# Pages only serves files, so the /api routes (AI, database, Telegram) stay on Render and the
# browser calls them there. See scripts/ci/build_pages.sh for what is left out of this build.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Optional repo variable API_BASE_URL to point at a different backend.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        run: bash scripts/ci/build_pages.sh
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL || 'https://sokhapheap-6c0l.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}km/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
