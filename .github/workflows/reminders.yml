# Sends due Telegram reminders once a day by calling the protected endpoint.
# Uses GitHub Actions instead of Render cron jobs (paid) or an in-app timer (free Render sleeps).
# Required repository secrets: APP_URL (e.g. https://sokhapheap.onrender.com) and CRON_SECRET.
name: Daily reminders

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 09:00 in Cambodia
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app (free Render instance may be asleep)
        run: curl -s --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "${{ secrets.APP_URL }}/api/health" > /dev/null
      - name: Send due reminders
        run: |
          curl -sS --fail-with-body --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
